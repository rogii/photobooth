<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10191a">
  <title>Photobooth Local Admin</title>
  <link rel="stylesheet" href="/static/local-admin.css">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <span class="eyebrow">LOCAL CONTROLS</span>
        <h1>Photobooth admin</h1>
        <p>Manage saved photos and Raspberry Pi access.</p>
      </div>
      <div class="top-actions">
        <a id="kiosk-link" class="button secondary" href="/">Back to kiosk</a>
        <button id="shutdown" class="button danger" type="button">Shut down Raspberry Pi</button>
      </div>
    </header>

    <section class="card pin-card">
      <div>
        <h2>Admin PIN</h2>
        <p class="muted">The initial PIN is 1234. Enter a new 4 to 12 digit PIN to change it.</p>
      </div>
      <form id="pin-form">
        <input id="new-pin" type="password" inputmode="numeric" minlength="4" maxlength="12" autocomplete="new-password" placeholder="New PIN" aria-label="New admin PIN">
        <button type="submit">Save PIN</button>
      </form>
    </section>

    <section class="card">
      <div class="photo-heading">
        <div>
          <h2>Saved photos</h2>
          <p class="muted">Moved photos leave the gallery and capture count. They remain in their session ZIP.</p>
        </div>
        <div class="photo-actions">
          <select id="session-filter" aria-label="Filter by session"><option value="">All sessions</option></select>
          <button id="refresh" class="secondary" type="button">Refresh</button>
          <button id="delete-selected" class="danger" type="button" disabled>Move selected to Deleted</button>
        </div>
      </div>
      <p id="photo-summary" class="muted" role="status">Loading photos…</p>
      <div id="photo-grid" class="photo-grid"></div>
    </section>

    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script src="/static/local-admin.js" defer></script>
</body>
</html>
