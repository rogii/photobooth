<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10191a">
  <title>Photobooth Local Admin</title>
  <link rel="stylesheet" href="/static/local-admin.css">
  <link rel="stylesheet" href="/static/pin-dialog.css">
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <span class="eyebrow">LOCAL CONTROLS</span>
        <h1>Photobooth admin</h1>
        <p>Manage saved photos and Raspberry Pi access.</p>
      </div>
      <div class="top-actions">
        <a id="kiosk-link" class="button secondary" href="/">Back to kiosk</a>
        <button id="change-pin" class="button secondary" type="button">Change admin PIN</button>
        <button id="exit-kiosk" class="button secondary" type="button">Exit to desktop</button>
        <button id="shutdown" class="button danger" type="button">Shut down Raspberry Pi</button>
      </div>
    </header>

    <section class="card">
      <div class="photo-heading">
        <div>
          <h2>Saved photos</h2>
          <p class="muted">Moved photos leave the Photo Wall and capture count. They remain in their session ZIP.</p>
        </div>
        <div class="photo-actions">
          <select id="session-filter" aria-label="Filter by session"><option value="">All sessions</option></select>
          <button id="refresh" class="secondary" type="button">Refresh</button>
          <button id="delete-selected" class="danger" type="button" disabled>Move selected to Deleted</button>
        </div>
      </div>
      <p id="photo-summary" class="muted" role="status">Loading photos…</p>
      <div id="photo-grid" class="photo-grid"></div>
    </section>

    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <dialog id="change-pin-dialog" class="admin-pin-card" aria-labelledby="change-pin-title">
    <form>
      <h1 id="change-pin-title">Enter new PIN</h1>
      <p>Choose a four-digit admin PIN.</p>
      <input id="new-pin" type="password" inputmode="numeric" autocomplete="new-password" aria-labelledby="change-pin-title">
      <div class="admin-pin-pad" aria-label="PIN keypad"></div>
      <div class="admin-pin-error" role="status"></div>
      <div class="admin-pin-actions"><button id="cancel-pin-change" type="button">Cancel</button></div>
    </form>
  </dialog>
  <script src="/static/pin-keypad.js" defer></script>
  <script src="/static/local-admin.js" defer></script>
</body>
</html>
