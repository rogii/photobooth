<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photobooth Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#10191a;color:#f4f0e6;font:16px system-ui,sans-serif}.wrap{max-width:820px;margin:40px auto;padding:0 20px}h1{font-size:32px}h2{font-size:18px;color:#e2fa83}.card{background:#1a2829;border:1px solid #354542;border-radius:10px;padding:20px;margin:16px 0}.status{white-space:pre-line;font:14px ui-monospace,monospace;color:#b8c4bd;line-height:1.8}form{display:flex;gap:10px;flex-wrap:wrap}input{background:#0d1516;border:1px solid #52615b;border-radius:5px;padding:11px;color:white;font:inherit}input[type=text]{flex:1;min-width:200px}button{border:0;border-radius:5px;background:#e2fa83;color:#162020;padding:11px 16px;font-weight:700;cursor:pointer}label{display:grid;gap:6px;color:#b8c4bd;min-width:180px;flex:1}label input{width:100%}.settings{display:flex;gap:14px;flex-wrap:wrap}#message{min-height:22px;color:#e2fa83}.muted{color:#a3afa8}a{color:#e2fa83}</style></head><body><main class="wrap"><h1>Photobooth admin</h1><p class="muted">Connect to the same Wi-Fi and open this device’s address on port 8081.</p><section class="card"><h2>System status</h2><div id="status" class="status">Loading…</div><p><button id="restart">Restart photobooth</button></p></section><section class="card"><h2>Event</h2><p class="muted">Photos are stored in a folder named after this event.</p><form id="event-form"><input id="event-name" type="text" placeholder="Event name" required><button>Start event</button></form></section><section class="card"><h2>Capture</h2><p class="muted">Starts a capture for the active event using the saved countdown and shot interval.</p><div class="settings"><button id="capture-one" type="button">Take one photo</button><button id="capture-four" type="button">Take four photos</button></div></section><section class="card"><h2>Persistent settings</h2><form id="settings-form" class="settings"><label>Countdown seconds<input name="countdown_seconds" type="number" min="0" max="30"></label><label>Between shots seconds<input name="sequence_interval_seconds" type="number" min="0" max="10" step="0.1"></label><label>Sequence photo countdown seconds<input name="sequence_countdown_seconds" type="number" min="0" max="30"><small>Countdown before each photo in a four shot sequence</small></label><label>Idle gallery columns<input name="idle_gallery_columns" type="number" min="1" max="12"></label><label>Result display timeout seconds<input name="result_timeout_seconds" type="number" min="1" max="300"></label><label>Camera command<input name="camera_command" type="text"></label><label>Flash GPIO pin<input name="gpio_flash_pin" type="number" min="0" max="27"></label><label>Flash duration seconds<input name="flash_seconds" type="number" min="0" max="5" step="0.01"></label><label>Upload URL<input name="upload_url" type="url"></label><label>Upload token<input name="upload_token" type="password" autocomplete="new-password"></label><label>Single capture key<input name="key_single" type="text" maxlength="1"></label><label>Four shot key<input name="key_sequence" type="text" maxlength="1"></label><button>Save settings</button></form></section><div id="message" role="status"></div></main><script src="/static/admin.js" defer></script></body></html>
