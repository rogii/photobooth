<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b0d"><title>Photobooth</title><link rel="stylesheet" href="/static/kiosk.css"></head>
<body><main id="screen" class="idle"><div id="gallery" class="gallery"></div><section id="overlay" class="overlay hidden"><div id="photo-position" class="photo-position hidden"></div><div id="countdown" class="countdown"></div><div id="capture-status" class="capture-status hidden"></div><div id="progress" class="progress hidden"><div class="spinner"></div><h1 id="progress-title">Capture download progress</h1><div class="bar"><i id="bar-fill"></i></div><span id="percent">0%</span></div><img id="result" class="result hidden" alt="Your photo"></section><div id="empty" class="empty hidden"><h1>Photobooth ready</h1><p>Choose an event in the admin panel to begin.</p></div><footer id="event-footer" class="event-footer hidden"><div class="event-heading"><span class="event-eyebrow">NOW CELEBRATING</span><strong id="event"></strong></div><div class="event-stats"><div class="event-stat"><strong id="capture-count">0</strong><span>CAPTURES</span></div><span class="footer-divider"></span><div class="event-stat upload-stat"><i id="upload-indicator"></i><strong id="upload-status">ALL UPLOADED</strong><span id="upload-count"></span></div></div></footer><div id="connection-status" class="connection-overlay hidden" role="status" aria-live="polite"><div><span class="connection-spinner"></span><h1>CONNECTION LOST</h1><p>Reconnecting to photobooth…</p></div></div><div id="error" class="error"></div></main><script src="/static/kiosk.js" defer></script></body></html>
